<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página informativa</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f4f6;
  color: #111;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  padding: 20px;
}

.container {
  max-width: 600px;
  background: #fff;
  padding: 30px;
  border-radius: 12px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.08);
  text-align: center;
}

h1 {
  font-size: 24px;
  margin-bottom: 15px;
}

p {
  font-size: 16px;
  color: #555;
  line-height: 1.6;
  margin-bottom: 15px;
}

.status {
  font-size: 14px;
  color: #888;
  margin-top: 10px;
}
</style>

</head>
<body>

<div class="container">
  <h1>Página informativa</h1>

  <p>
    Este ambiente foi criado para fins de teste, validação e organização de conteúdo digital.
  </p>

  <p>
    Nenhuma ação adicional é necessária neste momento. As informações apresentadas fazem parte de um processo interno de verificação e estruturação.
  </p>

  <div class="status">
    Status: ativo para validação técnica
  </div>
</div>

</body>
</html>
